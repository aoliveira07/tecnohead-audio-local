[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecnohead-audio-local"
version = "0.2.1"
description = "Home Assistant App para biblioteca local de áudio e LinkPlay"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.2",
  "httpx==0.28.1",
  "paho-mqtt==2.1.0",
  "pydantic==2.10.4",
  "tzdata==2025.2",
  "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

